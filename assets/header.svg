<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="50%" stop-color="#0f1620"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="218" rx="15" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- grid -->
  <g opacity="0.08" stroke="#64748b" stroke-width="0.5">
    <line x1="0" y1="44" x2="920" y2="44"/><line x1="0" y1="88" x2="920" y2="88"/>
    <line x1="0" y1="132" x2="920" y2="132"/><line x1="0" y1="176" x2="920" y2="176"/>
    <line x1="92" y1="0" x2="92" y2="220"/><line x1="184" y1="0" x2="184" y2="220"/>
    <line x1="276" y1="0" x2="276" y2="220"/><line x1="368" y1="0" x2="368" y2="220"/>
    <line x1="460" y1="0" x2="460" y2="220"/><line x1="552" y1="0" x2="552" y2="220"/>
    <line x1="644" y1="0" x2="644" y2="220"/><line x1="736" y1="0" x2="736" y2="220"/>
    <line x1="828" y1="0" x2="828" y2="220"/>
  </g>
  <!-- node graph motif -->
  <g filter="url(#glow)" opacity="0.9">
    <circle cx="780" cy="60" r="4" fill="#2dd4bf"/>
    <circle cx="840" cy="90" r="3" fill="#38bdf8"/>
    <circle cx="810" cy="140" r="5" fill="#2dd4bf"/>
    <circle cx="870" cy="50" r="3" fill="#94a3b8"/>
    <line x1="780" y1="60" x2="840" y2="90" stroke="#334155" stroke-width="1"/>
    <line x1="840" y1="90" x2="810" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="780" y1="60" x2="810" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="870" y1="50" x2="840" y2="90" stroke="#334155" stroke-width="1"/>
  </g>
  <text x="48" y="72" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Varun Billuri</text>
  <rect x="48" y="88" width="280" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="48" y="122" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="0.5">AI/ML ENGINEER · PRODUCTION SYSTEMS · MULTILINGUAL AI</text>
  <text x="48" y="158" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Worldish · Ex-ThoughtSpot MTS2 · Agentic AI · Voice · MLOps</text>
  <text x="48" y="188" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Andhra Pradesh, India</text>
</svg>
